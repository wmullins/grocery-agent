<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Grocery Agent{% endblock %}</title>
    <style>
        :root {
            --ink: #1a1a1a;
            --ink-muted: #666666;
            --line: #d9d9d9;
            --accent: #0036ff;
            --ok: #0a7a0a;
            --warn: #b5651d;
            --error: #b00020;
            --bg: #ffffff;
            --surface: #f7f7f5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--ink);
            background: var(--bg);
            line-height: 1.5;
            padding: 40px 24px;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 8px; }
        h2 { font-size: 20px; font-weight: 600; margin: 32px 0 12px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.5px; font-size: 13px; }
        p { margin: 0 0 16px; color: var(--ink-muted); }
        .nav {
            display: flex;
            gap: 24px;
            margin-bottom: 40px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--line);
        }
        .nav a { color: var(--ink-muted); font-weight: 500; font-size: 14px; }
        .nav a.active { color: var(--accent); }
        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .card h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--ink); }
        table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
        th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-muted); padding: 8px 6px; border-bottom: 1px solid var(--line); text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 10px 6px; border-bottom: 1px solid var(--line); font-size: 14px; }
        tr:hover { background: #fafafa; }
        .price { font-weight: 600; }
        .muted { color: var(--ink-muted); font-size: 13px; }
        .ok { color: var(--ok); }
        .warn { color: var(--warn); }
        .error { color: var(--error); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 24px; }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 16px;
        }
        .stat-value { font-size: 24px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
        .stat-label { font-size: 12px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-ok { background: #e9f7e9; color: var(--ok); }
        .badge-warn { background: #fdf3e7; color: var(--warn); }
        .badge-error { background: #fdeaea; color: var(--error); }
        .empty { text-align: center; padding: 40px; color: var(--ink-muted); }
        footer { margin-top: 60px; padding-top: 24px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-muted); }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
    <footer>
        Grocery Agent &middot; Local only &middot; No checkout, no payment
    </footer>
</body>
</html>
