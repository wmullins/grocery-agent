<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Grocery Agent{% endblock %}</title>
    <style>
        :root {
            --ink: #0a0a0a;
            --ink-muted: #666666;
            --line: #e5e5e5;
            --accent: #ff0033;
            --accent-dark: #cc0022;
            --blue: #0033ff;
            --blue-dark: #0022cc;
            --yellow: #ffcc00;
            --yellow-dark: #ccaa00;
            --bg: #ffffff;
            --surface: #f7f7f5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--ink);
            background: var(--bg);
            line-height: 1.5;
            padding: 40px 24px;
        }
        a { color: var(--accent); text-decoration: none; font-weight: 600; }
        a:hover { text-decoration: underline; }
        h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 8px;
            color: var(--ink);
        }
        h2 {
            font-size: 18px;
            font-weight: 700;
            margin: 40px 0 16px;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p { margin: 0 0 16px; color: var(--ink-muted); }
        .nav {
            display: flex;
            gap: 24px;
            margin-bottom: 40px;
            padding-bottom: 16px;
            border-bottom: 4px solid var(--ink);
        }
        .nav a {
            color: var(--ink-muted);
            font-weight: 600;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .nav a.active { color: var(--accent); }
        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .card h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--ink);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
        th {
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            color: var(--ink-muted);
            padding: 12px 8px;
            border-bottom: 2px solid var(--line);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        td { padding: 12px 8px; border-bottom: 1px solid var(--line); font-size: 14px; }
        tr:hover { background: #fafafa; }
        .price { font-weight: 700; color: var(--ink); }
        .muted { color: var(--ink-muted); font-size: 13px; }
        .ok { color: var(--blue); font-weight: 600; }
        .warn { color: var(--accent-dark); font-weight: 600; }
        .error { color: var(--accent-dark); font-weight: 600; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 24px;
        }
        .stat-value { font-size: 40px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
        .stat-label { font-size: 12px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 1px; }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-ok { background: #e6f0ff; color: var(--blue-dark); border: 1px solid #99ccff; }
        .badge-warn { background: #fff0e6; color: var(--accent-dark); border: 1px solid #ffaa88; }
        .badge-error { background: #ffe6e6; color: var(--accent-dark); border: 1px solid #ff9999; }
        .empty { text-align: center; padding: 60px; color: var(--ink-muted); }
        .empty code { background: var(--surface); padding: 2px 6px; border-radius: 4px; }
        footer {
            margin-top: 80px;
            padding-top: 24px;
            border-top: 4px solid var(--ink);
            font-size: 12px;
            color: var(--ink-muted);
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
    <footer>
        Grocery Agent &middot; Local only &middot; No checkout, no payment
    </footer>
</body>
</html>
