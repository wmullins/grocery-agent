[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grocery-agent"
version = "0.1.0"
description = "Personal grocery planning and price comparison agent"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "langgraph>=0.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
grocery = "grocery_agent.cli:app"
grocery-agent = "grocery_agent.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/grocery_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unreachable = true
disallow_any_generics = false
disable_error_code = ["no-any-return", "arg-type", "union-attr", "list-item", "attr-defined", "assignment", "type-arg", "no-untyped-def", "type-var"]
mypy_path = "src"
packages = ["grocery_agent"]
